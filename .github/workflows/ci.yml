name: Continuous Integration

on:
  push:
    branches:
      - main
      - phase-0-foundation
      - phase-2-research-records
      - phase-3-literature-retrieval
      - phase-4-knowledge-graph
      - phase-5-mathematical-tools
      - phase-6-controlled-lab
      - phase-7-tenant-scoped-record-store
      - phase-7-record-isolation-release-gate
      - phase-7-security-complete
      - phase-6-step5-operational-acceptance
      - phase-6-step4-migration-recovery
      - phase-6-step3-oidc-provider-evidence
      - phase-6-step2-sandbox-regressions
      - phase-6-step1-sandbox-release-gate
      - phase-6-fix-tenant-auth-ci
      - phase-6-execution-tenant-tests
  pull_request:
    branches:
      - main
      - phase-0-foundation
      - phase-2-research-records
      - phase-3-literature-retrieval
      - phase-4-knowledge-graph
      - phase-5-mathematical-tools
      - phase-6-controlled-lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check code style
        run: ruff check src tests
      - name: Run tests
        run: pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build production assets
        run: npm run build
