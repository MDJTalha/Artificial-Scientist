name: Continuous Integration

on:
  push:
    branches:
      - main
      - "phase-*"
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "ci/**"
      - "docs/**"
      - "integration/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check code style
        run: ruff check src tests
      - name: Run tests
        run: pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Install isolated E2E tooling
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.56.1 @axe-core/playwright@4.11.0
      - name: Build production assets
        run: npm run build
      - name: Run accessibility and conference workspace E2E
        run: npx playwright test

  release-gates:
    name: Release-gate policy and hardened regression checks
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate release-gate policy
        run: python scripts/validate_release_evidence.py
      - name: Install scientific evaluation dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run deterministic scientific reproducibility smoke benchmark
        run: python scripts/scientific_eval.py
      - name: Compile production validation helpers
        run: python -m py_compile scripts/validate_production_config.py scripts/sqlite_backup_restore.py scripts/oidc_probe.py scripts/scientific_eval.py
      - name: Build fixed laboratory sandbox image
        run: docker build --file deploy/sandbox/Dockerfile --tag asds-lab-sandbox:ci .
      - name: Smoke-test fixed laboratory sandbox
        run: |
          printf '%s\n' '{"operation":"statistics","inputs":{"values":[1,2,3],"variance_mode":"population"}}' |
            docker run --rm -i --network none --read-only --cap-drop ALL --security-opt no-new-privileges               --pids-limit 64 --memory 512m --cpus 1.0 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m               --user 65532:65532 asds-lab-sandbox:ci
      - name: Build production API container image
        run: docker build --file deploy/api.Dockerfile --tag asds-api:ci .
      - name: Smoke-test API container core readiness
        run: |
          set -eu
          docker volume create asds-api-ci-data
          docker run --detach --name asds-api-ci \
            --publish 127.0.0.1:18000:8000 \
            --mount source=asds-api-ci-data,target=/var/lib/asds \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 1g --cpus 1.0 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m \
            --env ARTIFICIAL_SCIENTIST_ENV=production \
            --env ARTIFICIAL_SCIENTIST_ALLOWED_ORIGINS=https://research.example.test \
            --env ARTIFICIAL_SCIENTIST_OIDC_ISSUER=https://identity.example.test/ \
            --env ARTIFICIAL_SCIENTIST_OIDC_AUDIENCE=asds-api \
            --env ARTIFICIAL_SCIENTIST_OIDC_JWKS_URL=https://identity.example.test/.well-known/jwks.json \
            --env ARTIFICIAL_SCIENTIST_DB_PATH=/var/lib/asds/artificial_scientist.sqlite3 \
            asds-api:ci
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:18000/api/v1/ready"
          last_error = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      payload = json.loads(response.read())
                      assert response.status == 200, payload
                      assert payload["status"] == "ready", payload
                      assert all(payload["checks"].values()), payload
                  print("API container core readiness: PASS")
                  break
              except (OSError, urllib.error.URLError, AssertionError) as error:
                  last_error = error
                  time.sleep(1)
          else:
              raise SystemExit(f"API container readiness failed: {last_error}")
          PY
          docker rm --force asds-api-ci
          docker volume rm asds-api-ci-data
      - name: Install backend test tools
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Exercise Phase 6 rehearsal, recovery and concurrency hardening
        working-directory: backend
        run: pytest -q tests/test_phase6_rehearsal.py tests/test_lab.py tests/test_lab_store.py tests/test_lab_quota_races.py tests/test_migration_recovery_assertions.py tests/test_execution_adapter.py
      - name: Exercise Phase 7 authorization matrix and tenant isolation
        working-directory: backend
        run: pytest -q tests/test_phase7_tenant_isolation.py tests/test_phase7_tenant_migration.py tests/test_phase7_tenant_policy.py tests/test_phase7_release_gate.py tests/test_release_authorization_matrix.py
      - name: Exercise Phases 8-14 bounded autonomy
        working-directory: backend
        run: pytest -q tests/test_autonomy_api.py tests/test_autonomy_persistence.py tests/test_autonomy_phases_8_14.py
