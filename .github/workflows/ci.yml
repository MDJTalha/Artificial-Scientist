name: Continuous Integration

on:
  push:
    branches:
      - main
      - "phase-*"
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "ci/**"
      - "docs/**"
      - "integration/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check code style
        run: ruff check src tests
      - name: Run tests
        id: backend-tests
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        shell: bash
        run: |
          set +e
          pytest 2>&1 | tee backend-test.log
          status=${PIPESTATUS[0]}
          exit ${status}
      - name: Publish backend test diagnostics to PR
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const version = process.env.PYTHON_VERSION
            const logPath = 'backend/backend-test.log'
            const log = fs.existsSync(logPath) ? fs.readFileSync(logPath, 'utf8') : 'backend-test.log was not produced'
            const body = [
              '### Backend test diagnostic — Python ' + version,
              '',
              'Temporary CI diagnostic for the release-hardening run.',
              '',
              'BACKEND-TEST-LOG',
              log.slice(-16000),
            ].join('\n')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })


  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Run unit tests
        id: frontend-unit
        shell: bash
        run: |
          set +e
          npm test -- --reporter=verbose 2>&1 | tee unit-test.log
          status=${PIPESTATUS[0]}
          exit ${status}
      - name: Publish frontend unit-test diagnostics to PR
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const logPath = 'frontend/unit-test.log'
            const log = fs.existsSync(logPath) ? fs.readFileSync(logPath, 'utf8') : 'unit-test.log was not produced'
            const body = [
              '### Frontend unit-test diagnostic',
              '',
              'Temporary CI diagnostic for the release-hardening run.',
              '',
              'UNIT-TEST-LOG',
              log.slice(-12000),
            ].join('\n')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
      - name: Install isolated E2E tooling
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.56.1 @axe-core/playwright@4.11.0
      - name: Build production assets
        run: npm run build
      - name: Run accessibility and conference workspace E2E
        id: frontend-e2e
        shell: bash
        run: |
          set +e
          npx playwright test 2>&1 | tee e2e-test.log
          status=${PIPESTATUS[0]}
          exit ${status}
      - name: Publish frontend E2E diagnostics to PR
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const logPath = 'frontend/e2e-test.log'
            const log = fs.existsSync(logPath) ? fs.readFileSync(logPath, 'utf8') : 'e2e-test.log was not produced'
            const body = [
              '### Frontend E2E diagnostic',
              '',
              'Temporary CI diagnostic for the release-hardening run.',
              '',
              'E2E-TEST-LOG',
              log.slice(-12000),
            ].join('\n')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })

  release-gates:
    name: Release-gate policy and hardened regression checks
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate release-gate policy
        run: python scripts/validate_release_evidence.py
      - name: Install backend test tools
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Exercise Phase 6 rehearsal, recovery and concurrency hardening
        working-directory: backend
        run: pytest -q tests/test_phase6_rehearsal.py tests/test_lab.py tests/test_lab_store.py tests/test_lab_quota_races.py tests/test_migration_recovery_assertions.py
      - name: Exercise Phase 7 authorization matrix and tenant isolation
        working-directory: backend
        run: pytest -q tests/test_phase7_tenant_isolation.py tests/test_phase7_tenant_migration.py tests/test_phase7_tenant_policy.py tests/test_phase7_release_gate.py tests/test_release_authorization_matrix.py
      - name: Exercise Phases 8-14 bounded autonomy
        working-directory: backend
        run: pytest -q tests/test_autonomy_api.py tests/test_autonomy_persistence.py tests/test_autonomy_phases_8_14.py
