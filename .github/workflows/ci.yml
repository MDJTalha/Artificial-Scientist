name: Continuous Integration

on:
  push:
    branches:
      - main
      - phase-0-foundation
      - phase-2-research-records
      - phase-3-literature-retrieval
      - phase-4-knowledge-graph
      - phase-5-mathematical-tools
      - phase-6-controlled-lab
      - phase-frontend-research-workspace
      - phase-frontend-accessibility-e2e
  pull_request:
    branches:
      - main
      - phase-0-foundation
      - phase-2-research-records
      - phase-3-literature-retrieval
      - phase-4-knowledge-graph
      - phase-5-mathematical-tools
      - phase-6-controlled-lab
      - phase-frontend-research-workspace
      - phase-frontend-accessibility-e2e
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check code style
        run: ruff check src tests
      - name: Run tests
        run: pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python for live API integration tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend for live API integration tests
        run: python -m pip install -e "../backend[dev]"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build production assets
        run: npm run build
      - name: Install browser test dependencies
        run: npm install --no-save --no-audit --no-fund @playwright/test @axe-core/playwright
      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end and accessibility checks
        run: npx playwright test
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-playwright-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
