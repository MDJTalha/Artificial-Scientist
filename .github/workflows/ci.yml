name: Continuous Integration

on:
  push:
    branches:
      - main
      - "phase-*"
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "ci/**"
      - "docs/**"
      - "integration/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check code style
        run: ruff check src tests
      - name: Run tests
        run: pytest

  postgres-integration:
    name: PostgreSQL integration (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: asds_test
          POSTGRES_USER: asds_test
          POSTGRES_PASSWORD: asds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asds_test -d asds_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ARTIFICIAL_SCIENTIST_DATABASE_URL: postgresql+psycopg://asds_test:asds_test@localhost:5432/asds_test
      ASDS_POSTGRES_TEST_DATABASE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Apply PostgreSQL schema migrations
        run: alembic upgrade head
      - name: Verify PostgreSQL migration rollback and re-application
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Verify PostgreSQL connection, migrations and readiness
        run: pytest tests/test_postgresql_integration.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build production assets
        run: npm run build
