[phases.setup]
nixPkgs = ["python312", "python312Packages.pip", "gcc"]

[phases.install]
# Nixpacks' Python provider otherwise caches only pyproject.toml before pip install.
# Include the package source and project README so setuptools can build the project.
onlyIncludeFiles = ["pyproject.toml", "README.md", "src"]
cmds = [
  "pip install ."
]

[start]
# Nixpacks installs Python dependencies into /opt/venv. Its PATH profile is not
# guaranteed to be loaded by the platform's non-login runtime shell, so invoke
# the virtualenv interpreter explicitly.
cmd = "/opt/venv/bin/python -m uvicorn artificial_scientist.main:app --host 0.0.0.0 --port $PORT"
