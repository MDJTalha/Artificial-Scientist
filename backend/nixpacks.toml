[phases.setup]
nixPkgs = ["python312", "python312Packages.pip", "gcc"]

[phases.install]
# Nixpacks' Python provider otherwise caches only pyproject.toml before pip install.
# Include the package source and project README so setuptools can build the project.
onlyIncludeFiles = ["pyproject.toml", "README.md", "src"]
cmds = [
  "pip install ."
]

[start]
# Dependencies are installed by the Nix-provided Python/pip toolchain.
# Use the Nix profile interpreter directly; /opt/venv is not created in this build.
cmd = "/root/.nix-profile/bin/python3.12 -m uvicorn artificial_scientist.main:app --host 0.0.0.0 --port $PORT"
