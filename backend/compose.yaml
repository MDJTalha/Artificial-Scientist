services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: artificial-scientist-api:local
    restart: unless-stopped
    environment:
      ARTIFICIAL_SCIENTIST_ENV: development
      ARTIFICIAL_SCIENTIST_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ARTIFICIAL_SCIENTIST_DB_PATH: /app/data/asds.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - asds-backend-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  asds-backend-data:
