services:
  asds-api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: artificial-scientist-api:local
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    environment:
      ARTIFICIAL_SCIENTIST_ENV: production
      ARTIFICIAL_SCIENTIST_NAME: Artificial Scientist
      ARTIFICIAL_SCIENTIST_VERSION: ${ASDS_VERSION:-0.1.0}
      ARTIFICIAL_SCIENTIST_ALLOWED_ORIGINS: ${ARTIFICIAL_SCIENTIST_ALLOWED_ORIGINS:?Set the HTTPS frontend origin}
      ARTIFICIAL_SCIENTIST_DB_PATH: /var/lib/asds/artificial_scientist.sqlite3
      ARTIFICIAL_SCIENTIST_OIDC_ISSUER: ${ARTIFICIAL_SCIENTIST_OIDC_ISSUER:?Set the exact OIDC issuer}
      ARTIFICIAL_SCIENTIST_OIDC_AUDIENCE: ${ARTIFICIAL_SCIENTIST_OIDC_AUDIENCE:?Set the API access-token audience}
      ARTIFICIAL_SCIENTIST_OIDC_JWKS_URL: ${ARTIFICIAL_SCIENTIST_OIDC_JWKS_URL:?Set the HTTPS JWKS URL}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      CROSSREF_CONTACT_EMAIL: ${CROSSREF_CONTACT_EMAIL:-}
    volumes:
      - asds-data:/var/lib/asds
    ports:
      - "127.0.0.1:${ASDS_API_BIND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  asds-data:
    name: asds-api-data
